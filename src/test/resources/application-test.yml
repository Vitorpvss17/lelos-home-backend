spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lelos_home}
    username: ${POSTGRES_USER:lelos}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

admin:
  email: ${ADMIN_EMAIL:admin@leloshome.com}
  password: ${ADMIN_PASSWORD:}
  name: Admin Test

# Desativado por padrão nos testes (a suite faz dezenas de logins do mesmo IP).
# O RateLimitIntegrationTest reativa via @TestPropertySource para validar o 429.
ratelimit:
  enabled: false

logging:
  level:
    com.leloshome: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: WARN
