spring:
  # Carrega um .env local (gitignored) se existir — provê segredos em dev/teste
  # sem versioná-los. Em produção os valores vêm das variáveis de ambiente.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lelos_home}
    username: ${POSTGRES_USER:lelos}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:}     # obrigatório (>=32 chars) — vem do .env (dev) ou env (prod)
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}    # 8h
  refresh-expiration-ms: 604800000  # 7d

whatsapp:
  number: "5511999999999"

# CORS: em dev liberamos qualquer origem; em produção defina CORS_ALLOWED_ORIGINS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# Rate limiting por IP (token bucket). capacity = nº de requisições por janela (refill-seconds)
ratelimit:
  enabled: ${RATELIMIT_ENABLED:true}
  login:
    capacity: ${RATELIMIT_LOGIN_CAPACITY:5}
    refill-seconds: ${RATELIMIT_LOGIN_REFILL_SECONDS:60}
  orders:
    capacity: ${RATELIMIT_ORDERS_CAPACITY:20}
    refill-seconds: ${RATELIMIT_ORDERS_REFILL_SECONDS:60}

admin:
  email: ${ADMIN_EMAIL:admin@leloshome.com}
  password: ${ADMIN_PASSWORD:}
  name: ${ADMIN_NAME:Admin Lelos}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never        # endpoint público: não vaza detalhes de componentes
      probes:
        enabled: true            # /actuator/health/liveness e /readiness
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.leloshome: DEBUG
