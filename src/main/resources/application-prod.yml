spring:
  datasource:
    # Railway: o DATABASE_URL vem como postgresql://... e o Spring precisa de jdbc:postgresql://...
    # Defina estas 3 variáveis no serviço do back referenciando o Postgres:
    #   SPRING_DATASOURCE_URL=jdbc:postgresql://${{Postgres.PGHOST}}:${{Postgres.PGPORT}}/${{Postgres.PGDATABASE}}
    #   SPRING_DATASOURCE_USERNAME=${{Postgres.PGUSER}}
    #   SPRING_DATASOURCE_PASSWORD=${{Postgres.PGPASSWORD}}
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

whatsapp:
  number: ${WHATSAPP_NUMBER}

# Obrigatório em produção: domínio(s) do front, separados por vírgula
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}
  name: ${ADMIN_NAME:Admin}

logging:
  level:
    com.leloshome: INFO
