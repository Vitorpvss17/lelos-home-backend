spring:
  datasource:
    url: ${DATABASE_URL}
  jpa:
    show-sql: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

whatsapp:
  number: ${WHATSAPP_NUMBER}

# Obrigatório em produção: domínio(s) do front, separados por vírgula
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}
  name: ${ADMIN_NAME:Admin}

logging:
  level:
    com.leloshome: INFO
